 struggle_for_iberia: "Struggle for Iberia"
 struggle_for_iberia_desc: "The Iberian War has caused thousends of dead, but it doesn't seem to be ending anytime soon. The Warlords and fanatists continue to fight to control more territory of what was once one unified nation. After the §Y\"Golpetazo del 29\"§!, a military revolution against the Kingdom of Iberia which was done taking advantage of the entablished Regency because of the dead of His Majesty the King Alfonso I of Iberia, the Royal institutions where deleted and a new government was imposed. The new authorities, who followed the Nationalpretorianist ideology, a political theory developed by Jose Antonio Primo de Rivera which is a mixture of falangism, cesarism and anarchism, imposed a harsh dictatorship where any type of oposition was supressed. The repression propelled the rebelion of Portuguese and Galician independence movements, and few days later the uprising of Spanish nationalists. Now who were once the Government of Iberia are consider by the rebels as rebels, and the rebels consider themselfs as legitimate Governments. \n\nWe must put an end to this War once and for all!"
 iberian_irredentism: "Iberian Irredentism"
 iberian_irredentism_desc: "The Iberian Peninsula was once a unified country, but now is a bunch of rebel governments trying to legitimize their institutions and rights over the territories they own. The states, its leaders and the most fanatical citizens claim for unify the most peninsular territories they can in order to save our countrymen! \n\n§G¡Viva Iberia!§!"
 peoples_army_of_galicia: "People's Army of §CGalicia§!"
 peoples_army_of_galicia_desc: "Finally, we are an independent country! Our brave soldiers had fought for years to obtain the independence we got just a year ago. Now §CGalicia§! is entablished as an independent and free Council Communist Republic, where the workers and the peasents are the ones who govern. Our leader, Enrique Lister, is the great leader of our nation and holds, by the grace of the free people of §CGalicia§!, the title of §RCamarada do Pobo§!. More noble than a nobleman, our great leader had organized the People's Army of §CGalicia§! and they became the official army of the state. \n\n§CViva Galiza libre!§!"
 distmantling_the_state: "Distmantling the state"
 distmantling_the_state_desc: "The state is the main source of capitalist and marxist opression over the nation, so as the heroes who will free Iberia from its economic dictatorship we must end with the state and limit its presence to the minimum. The nation will probably suffer from the lack of what they had need for years, but it doesn't care, they'll understand that our aim will free them from their chains!"
 roman_bastion: "The last Roman bastion of the occident"
 roman_bastion_desc: "In the 27th a.D, Cesar Augustus proclaimed the Roman Empire after defeating the corrupted and evil Republic and declared himself Emperor. Jose Antonio Primo de Rivera did the same in Iberia, he saved us from the evil Kingdom and start a new and great age, but some radical insurrect armies have decided to continue the opression of the people and the supression of their freedom trying to defeat our noble government, but the Cesar of Iberia won't fall, God has given this holy government to Iberia to free it, not to end it!"
 anticommunist_crusade: "Anti-Communist Crusade"
 anticommunist_crusade_desc: "The capitalist thread appeard to defeat the feudal thread, and the communist thread to defeat the capitalist, but they're still a danger for our society! Now that the capitalism is falling and new ideologies are appearing we must attack the false solution some rich noblemen are proposing under the flag of the workers. God wants us to attack them, as he wanted to attack the muslims in the Middle Ages, so this is a crusade against the evil!"