 GLC_enrique_lister: "§RCamarada do Pobo§! Enrique Lister"
 GLC_enrique_lister_desc: "Born 21 April 1907, Ameneiro, Spain\n\nEnrique Lister is a communist Galician independence polititian that has been involve in politics since the 1927 general strike of the already dissolved Kingdom of Iberia, where he was a member of the Revolutionary Iberian Front, a insurgent organization that fought against the monarchy and wanted to entablish a federal and communist republic. After the end of the strikes, he joined the BNG, the National Galician Bloc, a communist independentist galician organization, and later promoted to President of the Party. After the §Y\"Golpetazo del 29\"§!, he led the People's Army of Galicia and, on January 1st, he proclaimed in Lugo the Socialist Republic of Galicia, a council-communist republic. No decision in Galicia is done without his supervision, and he kept absolute power over the state."

 GIR_jose_antonio: "§OD.G. Cesar de Iberia§! J.A. Primo de Rivera"
 GIR_jose_antonio_desc: "Born 24 April 1903, Madrid, Spain\n\nJose Antonio Primo de Rivera, son of the old Regent of the already dissolved Kingdom of Iberia, Miguel Primo de Rivera, is the current leader of the Iberian Realm, the ashes of the Iberian Kingdom that now is internationally considered as a group of fanatist rebels. He, as a big fan of ancient history, has inspired his government in the Ancient Roman Empire, at the point he even declared himself §YCesar de Iberia§!. He was the architect of the coup d'etat known as §Y\"Golpetazo del 29\"§!, which occasionated the fall of the unified Kingdom of Iberia under local militias. Now Jose Antonio is applying decentralization and militarist policies in order to create what he always has dreamed, a chatholic nation where the only institution that mantains the nation joint is the army, facing at the same time the iberian rebels and trying to reentablish Iberia as a unified state."