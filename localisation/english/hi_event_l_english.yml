 galicia.1.t: "Camarada do Pobo Enrique Lister proclaims the Socialist Republic of Galicia!"
 galicia.1.d: "There was a great day in Lugo. A sunny day with a light breeze, the birds sang and some clouds could be seen at the horizon. The crowds were celebrating in the midtown, they were anxious for the anouncement that our great leader was about to tell us. Some minutes later, our Camarada do Pobo went on stage and, with his strong and confident voice, told us his plans for Galicia. He told us that, even with the constant attacks of foreign fascist militias, Galicia would be a strong and peaceful country, no one would be homeless nor hungry and a communist council republic will be entablished! He continued saying: \"I'm glad to announce the proclamation of the Socialist Republic of Galicia!\". The crowd was divided, some celebrated the proclamation and waved galician flags, other were dissapointed and even faced our great leader! It doesn't matter, those who faced him now are imprison because of his unloyal and coup attitude!"
 galicia.1.a: "§CViva Galiza libre!§!"